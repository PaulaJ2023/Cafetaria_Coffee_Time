<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Time</title>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
    <div class="menu-container">
      <input type="checkbox" id="menu" class="menu-lateral-check">
      <label for="menu" class="botao-menu">
        <img src="menu-fofo.png" alt="Menu">
      </label>
      
      <nav class="sidebar">
        <label for="menu" class="botao-fechar">&times;</label>
        
        <input type="checkbox" id="popup-controle">
        <label for="popup-controle" class="usuario-menu">
          <div class="foto-perfil"></div>
          <span class="nome-usuario">Entrar / Registrar</span>
        </label>

        <div class="popup-overlay">
          <<div class="popup-conteudo">
    <label for="popup-controle" class="popup-fechar">&times;</label>
    <h2 class="titulo-popup">Área de Login</h2>
    <form class="formulario-login">
        <input type="text" placeholder="E-mail ou Usuário" required>
        <input type="password" placeholder="Senha" required>
        
        <button type="submit" id="entrar-login">Entrar</button>
        
        <div class="botoes-lado-a-lado">
            <button type="button" id="esqueci-senha">Esqueci a senha</button>
            <button type="button" id="registrar">Ainda não tem conta? Registrar</button>
        </div>
    </form>
</div>
        </div>
        <!--Links do menu lateral-->
        <a href="#">Pagamentos</a>
        <a href="#">Acessibiliade</a>
        <a href="#">Ajuda</a>
        <a href="#">Contatos</a>
        <a href="#">configurações</a>
        <a href="#">Serviços</a>
        <a href="#">Sobre o Coffee Time</a>
      </nav>
    </div>

    <img src="Logo_Coffee_Time.png" alt="Logo" class="logo">
  </header>

  <section class="hero">
    <h1>Seja Bem-Vindo ao Coffee Time!</h1>
  </section>

  <!-- PRODUTOS -->
    <main class="produtos">

      <h2>Bebidas quentes</h2>

      <div class="grid">

        <div class="card">
          <img src="">
          <h3>Café Expresso</h3>
          <p>R$</p>
          <button>+ adicionar</button>
        </div>

        <div class="card">
          <img src="">
          <h3>Cappuccino</h3>
          <p>R$</p>
          <button>+ adicionar</button>
        </div>

        <div class="card">
          <img src="">
          <h3>Café Americano</h3>
          <p>R$</p>
          <button>+ adicionar</button>
        </div>

        <div class="card">
          <img src="">
          <h3>Coffee</h3>
          <p>R$</p>
          <button>+ adicionar</button>
        </div>

      </div>
    </main>

</body>
</html>
